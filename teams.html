<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team directory — Gen Z Volleyball Malawi</title>
    <meta
      name="description"
      content="Find registered volleyball teams across Malawi, explore rosters, and see upcoming sessions."
    />
    <meta name="theme-color" content="#214c3b" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="assets/brand/mark.svg" />
    <link
      rel="preload"
      href="assets/fonts/dm-sans-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/barlow-condensed-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body id="top">
    <nav class="nav"></nav>
    <main id="main">
      <header class="page-heading">
        <div class="container page-heading-row">
          <div>
            <div class="eyebrow">The team directory</div>
            <h1>Find your side of the net.</h1>
            <p>
              Meet the teams in the GZVM community. Find a local squad, check
              its roster, and see what’s coming up.
            </p>
          </div>
          <div class="button-row">
            <a class="btn btn-primary" href="register.html?type=team"
              >Register your team ↗</a
            >
          </div>
        </div>
      </header>
      <section class="container page-body" aria-label="Registered teams">
        <div class="toolbar">
          <div class="toolbar-fields">
            <div class="form-group">
              <label for="city-filter">City</label
              ><select class="form-control" id="city-filter">
                <option value="">All cities</option>
              </select>
            </div>
            <div class="form-group">
              <label for="search">Find a team</label
              ><input
                class="form-control"
                type="search"
                id="search"
                placeholder="Name or coach"
                autocomplete="off"
              />
            </div>
          </div>
          <div class="cluster">
            <p class="result-count" id="team-count" role="status"></p>
            <button class="btn btn-ghost btn-sm" id="clear-filters" hidden>
              Clear filters
            </button>
          </div>
        </div>
        <div class="team-list" id="teams-list"></div>
        <p class="table-note">
          Player counts reflect registrations linked to each team. A free agent?
          <a href="register.html">Register as a player</a> and choose a team.
        </p>
      </section>
    </main>
    <footer class="footer"></footer>
    <dialog
      id="team-modal"
      class="modal-wide"
      aria-labelledby="team-modal-name"
    >
      <div class="modal-header">
        <h2 id="team-modal-name">Team details</h2>
        <button class="modal-close" data-close aria-label="Close team details">
          ✕
        </button>
      </div>
      <div class="modal-body" id="team-modal-body"></div>
    </dialog>
    <script src="js/supabase-sync.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/pages/teams.js" defer></script>
  </body>
</html>
