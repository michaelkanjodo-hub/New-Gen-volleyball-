<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen Z Volleyball Malawi — Train. Play. Rise.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%90%3C/text%3E%3C/svg%3E">
<style>
/* =========================================================
   CSS — all inlined
   ========================================================= */
:root {
  --c-primary: #ff3b6b; --c-primary-dark: #c81f4d;
  --c-accent: #ffd400; --c-accent-2: #00d4a8;
  --c-deep: #0b1426; --c-deeper: #050a17;
  --c-card: #12203b; --c-card-2: #1a2a4a;
  --c-text: #f5f7fb; --c-muted: #9aa7c2;
  --c-success: #19d27c; --c-danger: #ff4d4d; --c-warning: #ffa500; --c-info: #4aa3ff;
  --gradient-1: linear-gradient(135deg, #ff3b6b 0%, #ffd400 100%);
  --gradient-2: linear-gradient(135deg, #00d4a8 0%, #4aa3ff 100%);
  --gradient-3: linear-gradient(135deg, #0b1426 0%, #1a2a4a 100%);
  --shadow-3d: 0 12px 0 0 rgba(0,0,0,0.35), 0 18px 40px rgba(0,0,0,0.4);
  --shadow-glow: 0 0 30px rgba(255, 59, 107, 0.45);
  --radius: 14px; --radius-lg: 22px;
  --font-display: 'Bebas Neue', 'Oswald', Impact, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}
@font-face { font-family: 'Bebas Neue'; src: local('Bebas Neue'), local('Oswald'), local('Impact'); }
@font-face { font-family: 'Inter'; src: local('Inter'), local('system-ui'); }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--c-deeper);color:var(--c-text);font-family:var(--font-body);line-height:1.5;overflow-x:hidden;scroll-behavior:smooth}
a{color:var(--c-accent);text-decoration:none;transition:color .2s}a:hover{color:var(--c-primary)}
img{max-width:100%;display:block}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;letter-spacing:.5px;text-transform:uppercase;line-height:1.1}
h1{font-size:clamp(2.4rem,6vw,5rem)}h2{font-size:clamp(1.8rem,4vw,3rem);margin-bottom:.6em}h3{font-size:clamp(1.2rem,2.5vw,1.6rem);margin-bottom:.4em}
.scene-3d{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at top,#142a55 0%,var(--c-deeper) 60%);overflow:hidden}
.scene-3d::before,.scene-3d::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:floatBlob 18s ease-in-out infinite}
.scene-3d::before{width:480px;height:480px;background:var(--c-primary);top:-120px;left:-120px}
.scene-3d::after{width:520px;height:520px;background:var(--c-accent-2);bottom:-160px;right:-120px;animation-delay:-9s}
@keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(80px,-40px) scale(1.1)}66%{transform:translate(-60px,60px) scale(.95)}}
.ball-3d{position:fixed;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 0%,#ffd400 30%,#c89b00 80%);box-shadow:inset -10px -10px 20px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.5);z-index:1;pointer-events:none;animation:floatBall 12s ease-in-out infinite;top:30%;right:8%;opacity:.85}
.ball-3d::before{content:"";position:absolute;inset:8px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 60deg,#c81f4d 60deg 90deg,transparent 90deg 240deg,#c81f4d 240deg 270deg,transparent 270deg);mask:radial-gradient(circle,transparent 30%,#000 32%,#000 60%,transparent 62%);-webkit-mask:radial-gradient(circle,transparent 30%,#000 32%,#000 60%,transparent 62%);opacity:.85}
@keyframes floatBall{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-40px) rotate(180deg)}}
.container{width:min(1240px,92%);margin:0 auto}
.row{display:flex;flex-wrap:wrap;gap:1.5rem}.col{flex:1 1 280px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.5rem}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
main{padding:2rem 0 5rem;min-height:70vh;position:relative;z-index:2}
section{margin:3rem 0}
.section-title{display:flex;align-items:center;gap:.8rem;margin-bottom:1.5rem}
.section-title .badge{background:var(--gradient-1);color:var(--c-deep);padding:.2rem .7rem;border-radius:999px;font-size:.7rem;font-weight:800;letter-spacing:1px;box-shadow:var(--shadow-3d)}
.section-title h2{margin:0}
.nav{position:sticky;top:0;z-index:100;background:rgba(11,20,38,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:2px solid rgba(255,59,107,.3)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:.8rem 0}
.brand{display:flex;align-items:center;gap:.7rem;font-family:var(--font-display);font-size:1.5rem;color:var(--c-text);letter-spacing:1px}
.brand:hover{color:var(--c-text)}
.brand .logo{width:42px;height:42px;border-radius:50%;background:var(--gradient-1);display:grid;place-items:center;font-size:1.4rem;box-shadow:var(--shadow-3d),var(--shadow-glow);transform:rotateZ(-8deg);transition:transform .3s}
.brand:hover .logo{transform:rotateZ(8deg) scale(1.05)}
.brand small{display:block;font-size:.6rem;color:var(--c-muted);letter-spacing:3px;font-family:var(--font-body)}
.nav-links{display:flex;gap:.4rem;align-items:center;list-style:none}
.nav-links a{color:var(--c-text);padding:.5rem .9rem;border-radius:8px;font-weight:600;font-size:.95rem;transition:all .2s;position:relative;cursor:pointer}
.nav-links a:hover,.nav-links a.active{background:rgba(255,59,107,.15);color:var(--c-accent)}
.nav-toggle{display:none;background:none;border:none;color:var(--c-text);font-size:1.6rem;cursor:pointer}
@media(max-width:880px){.nav-links{position:absolute;top:100%;left:0;right:0;background:var(--c-deep);flex-direction:column;padding:1rem;transform:translateY(-200%);transition:transform .3s;border-bottom:2px solid var(--c-primary)}.nav-links.open{transform:translateY(0)}.nav-toggle{display:block}}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.4rem;border-radius:10px;font-weight:700;font-size:.95rem;border:none;cursor:pointer;transition:transform .15s,box-shadow .15s,background .2s;font-family:var(--font-body);text-transform:uppercase;letter-spacing:.5px;text-decoration:none}
.btn:active{transform:translateY(2px)}
.btn-primary{background:var(--gradient-1);color:var(--c-deep);box-shadow:var(--shadow-3d)}
.btn-primary:hover{box-shadow:var(--shadow-3d),var(--shadow-glow);transform:translateY(-2px);color:var(--c-deep)}
.btn-accent{background:var(--gradient-2);color:var(--c-deep);box-shadow:var(--shadow-3d)}
.btn-accent:hover{transform:translateY(-2px);color:var(--c-deep)}
.btn-ghost{background:transparent;color:var(--c-text);border:2px solid rgba(255,255,255,.2)}
.btn-ghost:hover{border-color:var(--c-accent);color:var(--c-accent)}
.btn-sm{padding:.5rem .9rem;font-size:.85rem}.btn-block{width:100%;justify-content:center}
.card{background:linear-gradient(180deg,var(--c-card) 0%,var(--c-card-2) 100%);border-radius:var(--radius);padding:1.4rem;border:1px solid rgba(255,255,255,.06);box-shadow:var(--shadow-3d);position:relative;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 0 0 rgba(0,0,0,.35),0 22px 50px rgba(255,59,107,.2)}
.card-3d{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .1s}
.card-glass{background:rgba(18,32,59,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.form-group{margin-bottom:1rem}
.form-group label{display:block;margin-bottom:.4rem;font-weight:600;font-size:.9rem;color:var(--c-muted);letter-spacing:.3px}
.form-control{width:100%;padding:.75rem .9rem;background:var(--c-deeper);color:var(--c-text);border:2px solid rgba(255,255,255,.1);border-radius:10px;font-size:.95rem;font-family:var(--font-body);transition:border-color .2s,box-shadow .2s}
.form-control:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(255,59,107,.2)}
.form-control::placeholder{color:var(--c-muted)}
textarea.form-control{min-height:100px;resize:vertical}select.form-control{cursor:pointer}
.file-drop{border:2px dashed rgba(255,255,255,.2);padding:1.5rem;text-align:center;border-radius:12px;cursor:pointer;transition:all .2s;color:var(--c-muted)}
.file-drop:hover,.file-drop.drag{border-color:var(--c-accent);color:var(--c-accent);background:rgba(255,212,0,.05)}
.file-drop input{display:none}
.checkbox-row{display:flex;align-items:flex-start;gap:.6rem;font-size:.9rem;color:var(--c-muted)}.checkbox-row input{margin-top:.25rem}
.tag{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.tag-pink{background:rgba(255,59,107,.2);color:var(--c-primary)}
.tag-teal{background:rgba(0,212,168,.2);color:var(--c-accent-2)}
.tag-yellow{background:rgba(255,212,0,.2);color:var(--c-accent)}
.tag-blue{background:rgba(74,163,255,.2);color:var(--c-info)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:200;padding:1rem;animation:fadeIn .2s}
.modal-backdrop.open{display:flex}
.modal{background:var(--c-card);border-radius:var(--radius-lg);max-width:720px;width:100%;padding:2rem;box-shadow:0 30px 60px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);max-height:90vh;overflow-y:auto;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.modal-close{background:none;border:none;color:var(--c-muted);font-size:1.5rem;cursor:pointer}.modal-close:hover{color:var(--c-primary)}
.toast-stack{position:fixed;top:80px;right:20px;z-index:300;display:flex;flex-direction:column;gap:.5rem}
.toast{background:var(--c-card);color:var(--c-text);padding:.9rem 1.2rem;border-radius:10px;border-left:4px solid var(--c-primary);box-shadow:var(--shadow-3d);animation:slideIn .3s;max-width:320px}
.toast.success{border-color:var(--c-success)}.toast.error{border-color:var(--c-danger)}.toast.info{border-color:var(--c-info)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.footer{background:var(--c-deep);border-top:1px solid rgba(255,255,255,.06);padding:2.5rem 0 1.5rem;margin-top:3rem;position:relative;z-index:2}
.footer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2rem;margin-bottom:1.5rem}
.footer h4{font-size:1rem;color:var(--c-accent);margin-bottom:.7rem}.footer ul{list-style:none}
.footer li{margin-bottom:.4rem;font-size:.9rem}.footer a{color:var(--c-muted)}.footer a:hover{color:var(--c-accent)}
.footer-bottom{text-align:center;color:var(--c-muted);font-size:.85rem;padding-top:1.5rem;border-top:1px solid rgba(255,255,255,.05)}
.text-center{text-align:center}.muted{color:var(--c-muted)}
.gradient-text{background:var(--gradient-1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.divider{height:2px;background:var(--gradient-1);margin:1.5rem 0;border-radius:2px}
.tilt-on-hover{transition:transform .2s}.tilt-on-hover:hover{transform:perspective(600px) rotateX(2deg) rotateY(-2deg) scale(1.02)}
.chat-fab{position:fixed;bottom:24px;right:24px;width:60px;height:60px;border-radius:50%;background:var(--gradient-1);color:var(--c-deep);border:none;font-size:1.6rem;cursor:pointer;box-shadow:var(--shadow-3d),var(--shadow-glow);z-index:90;transition:transform .2s}
.chat-fab:hover{transform:scale(1.1) rotate(8deg)}
.chat-panel{position:fixed;bottom:100px;right:24px;width:340px;max-width:calc(100vw - 32px);height:480px;max-height:70vh;background:var(--c-card);border-radius:var(--radius-lg);border:1px solid rgba(255,255,255,.1);box-shadow:var(--shadow-3d);display:none;flex-direction:column;z-index:95;overflow:hidden;animation:pop .3s}
.chat-panel.open{display:flex}
.chat-header{background:var(--gradient-1);color:var(--c-deep);padding:.9rem 1rem;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.chat-header button{background:none;border:none;color:var(--c-deep);cursor:pointer;font-size:1.2rem}
.chat-body{flex:1;overflow-y:auto;padding:.8rem;display:flex;flex-direction:column;gap:.5rem;background:var(--c-deeper)}
.chat-msg{padding:.5rem .8rem;border-radius:10px;background:var(--c-card-2);max-width:80%;font-size:.9rem;word-wrap:break-word;animation:slideIn .2s}
.chat-msg .who{font-size:.7rem;color:var(--c-accent);font-weight:700}
.chat-msg.me{align-self:flex-end;background:var(--c-primary);color:white}.chat-msg.me .who{color:rgba(255,255,255,.8)}
.chat-input{display:flex;gap:.4rem;padding:.6rem;background:var(--c-card);border-top:1px solid rgba(255,255,255,.05)}
.chat-input input{flex:1;background:var(--c-deeper);color:var(--c-text);border:1px solid rgba(255,255,255,.1);padding:.5rem .7rem;border-radius:8px;font-size:.9rem}
.chat-input button{background:var(--gradient-1);color:var(--c-deep);border:none;padding:.5rem .9rem;border-radius:8px;font-weight:700;cursor:pointer}
.live-fab{position:fixed;bottom:24px;right:100px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#ff3b6b 0%,#ffd400 100%);color:#0b1426;border:none;font-size:1.6rem;cursor:pointer;box-shadow:0 12px 0 0 rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.4),0 0 30px rgba(255,59,107,.6);z-index:90;transition:transform .2s}
.live-fab:hover{transform:scale(1.1) rotate(-8deg)}.live-fab.active{animation:livePulse 1.5s infinite}
@keyframes livePulse{0%,100%{box-shadow:0 12px 0 0 rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.4),0 0 30px rgba(255,59,107,.6)}50%{box-shadow:0 12px 0 0 rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.4),0 0 50px rgba(255,59,107,1)}}
.ticker{background:var(--c-deep);border-top:2px solid var(--c-primary);border-bottom:2px solid var(--c-primary);padding:.6rem 0;overflow:hidden;white-space:nowrap;position:relative}
.ticker::before,.ticker::after{content:"";position:absolute;top:0;bottom:0;width:80px;z-index:2;pointer-events:none}
.ticker::before{left:0;background:linear-gradient(90deg,var(--c-deep),transparent)}.ticker::after{right:0;background:linear-gradient(-90deg,var(--c-deep),transparent)}
.ticker-track{display:inline-block;animation:ticker 40s linear infinite;font-weight:600;font-size:.9rem}
.ticker-track span{margin:0 1.5rem}.ticker-track .win{color:var(--c-success)}.ticker-track .loss{color:var(--c-danger)}.ticker-track .draw{color:var(--c-warning)}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.hero{position:relative;padding:4rem 0 3rem;text-align:center;overflow:hidden}
.hero h1{margin-bottom:1rem}.hero p{font-size:1.15rem;color:var(--c-muted);max-width:640px;margin:0 auto 1.5rem}
.hero-cta{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.countdown{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin:1.5rem 0}
.countdown-unit{background:var(--c-card);border-radius:var(--radius);padding:.8rem 1.2rem;min-width:90px;text-align:center;box-shadow:var(--shadow-3d);border:1px solid rgba(255,59,107,.2);transition:transform .2s}
.countdown-unit:hover{transform:translateY(-4px) rotateZ(-2deg)}
.countdown-unit .num{font-family:var(--font-display);font-size:2.4rem;color:var(--c-accent);display:block;line-height:1}
.countdown-unit .lbl{font-size:.7rem;color:var(--c-muted);text-transform:uppercase;letter-spacing:1.5px}
.scorepad{background:var(--c-card);border-radius:var(--radius-lg);padding:1.5rem;box-shadow:var(--shadow-3d);border:2px solid var(--c-primary)}
.scorepad-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;padding-bottom:.8rem;border-bottom:1px solid rgba(255,255,255,.1)}
.scorepad-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center}
.scorepad-team{text-align:center}.scorepad-team h4{font-size:1.1rem;margin-bottom:.3rem;color:var(--c-text)}
.scorepad-team .name{font-family:var(--font-body);font-weight:700;text-transform:none}
.scorepad-score{font-family:var(--font-display);font-size:4rem;line-height:1;color:var(--c-accent);margin:.5rem 0;display:flex;align-items:center;gap:.4rem;justify-content:center}
.scorepad-score button{background:rgba(255,255,255,.08);color:var(--c-text);border:none;width:32px;height:32px;border-radius:8px;font-size:1.2rem;font-weight:700;cursor:pointer}
.scorepad-score button:hover{background:var(--c-primary);color:white}
.scorepad-vs{font-family:var(--font-display);color:var(--c-muted);font-size:1.5rem}
.scorepad-sets{display:flex;gap:.5rem;justify-content:center;margin-top:.8rem;flex-wrap:wrap}
.set-pill{background:var(--c-deeper);color:var(--c-text);padding:.3rem .7rem;border-radius:6px;font-weight:700;font-size:.85rem;border:1px solid rgba(255,255,255,.1)}
.scorepad-actions{display:flex;gap:.5rem;justify-content:center;margin-top:1rem;flex-wrap:wrap}
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:.8rem 1rem;text-align:left}
thead th{background:var(--c-card);color:var(--c-accent);font-family:var(--font-display);text-transform:uppercase;letter-spacing:1px;font-size:.85rem;border-bottom:2px solid var(--c-primary)}
tbody tr{background:var(--c-card-2);border-bottom:1px solid rgba(255,255,255,.04);transition:background .2s}
tbody tr:hover{background:rgba(255,59,107,.08)}
.rank-badge{display:inline-block;width:28px;height:28px;text-align:center;line-height:28px;border-radius:50%;font-weight:800;font-size:.85rem}
.rank-1{background:var(--c-accent);color:var(--c-deep)}.rank-2{background:#c0c0c0;color:var(--c-deep)}.rank-3{background:#cd7f32;color:var(--c-deep)}.rank-n{background:rgba(255,255,255,.1);color:var(--c-text)}
.court-map{position:relative;width:100%;aspect-ratio:16/9;background:radial-gradient(circle at 50% 50%,#1a4a2a 0%,#0d2e1a 100%);border-radius:var(--radius);overflow:hidden;border:2px solid var(--c-accent);box-shadow:var(--shadow-3d)}
.court-lines{position:absolute;inset:8%;border:3px solid rgba(255,255,255,.6);pointer-events:none}
.court-lines::before,.court-lines::after{content:"";position:absolute;background:rgba(255,255,255,.4)}
.court-lines::before{top:0;left:50%;width:3px;height:100%;transform:translateX(-50%)}
.court-lines::after{top:50%;left:0;width:100%;height:3px;transform:translateY(-50%)}
.net{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:6px;height:84%;background:linear-gradient(180deg,var(--c-muted),#555);box-shadow:0 0 10px rgba(255,255,255,.3)}
.map-pin{position:absolute;width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg) translate(-50%,-50%);background:var(--c-primary);border:2px solid white;box-shadow:0 4px 10px rgba(0,0,0,.4);cursor:pointer;display:grid;place-items:center;color:white;font-weight:800;transition:transform .2s;animation:pinBounce 2s ease-in-out infinite}
.map-pin span{transform:rotate(45deg);font-size:.8rem}
.map-pin:hover{transform:rotate(-45deg) translate(-50%,-50%) scale(1.2);z-index:5}
.map-pin.pin-2{background:var(--c-accent)}.map-pin.pin-3{background:var(--c-accent-2)}.map-pin.pin-4{background:var(--c-info)}
@keyframes pinBounce{0%,100%{transform:rotate(-45deg) translate(-50%,-50%) translateY(0)}50%{transform:rotate(-45deg) translate(-50%,-50%) translateY(-6px)}}
.map-legend{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);padding:.5rem .7rem;border-radius:8px;font-size:.75rem;z-index:4}
.map-legend div{display:flex;align-items:center;gap:.4rem;margin:.15rem 0}.map-legend .dot{width:10px;height:10px;border-radius:50%}
.highlight-card{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--c-card) 0%,var(--c-deep) 100%);border-radius:var(--radius);overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.06);box-shadow:var(--shadow-3d);transition:transform .2s}
.highlight-card:hover{transform:translateY(-4px) scale(1.02)}
.highlight-thumb{position:absolute;inset:0;display:grid;place-items:center;font-size:4rem;background:radial-gradient(circle at center,rgba(255,59,107,.2),transparent 60%)}
.play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:var(--gradient-1);display:grid;place-items:center;color:var(--c-deep);font-size:1.4rem;box-shadow:0 0 0 6px rgba(255,255,255,.15),var(--shadow-3d);z-index:2;transition:transform .2s}
.highlight-card:hover .play-btn{transform:translate(-50%,-50%) scale(1.1)}
.highlight-info{position:absolute;bottom:0;left:0;right:0;padding:1rem;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent)}
.highlight-info h4{font-size:.95rem}.highlight-meta{font-size:.75rem;color:var(--c-muted)}
.progress{height:10px;background:var(--c-deeper);border-radius:999px;overflow:hidden;margin:.4rem 0}
.progress-bar{height:100%;background:var(--gradient-1);border-radius:999px;transition:width .5s}
.progress-bar.teal{background:var(--gradient-2)}.progress-bar.yellow{background:var(--c-accent)}
.progress-label{display:flex;justify-content:space-between;font-size:.85rem;margin-top:.2rem;color:var(--c-muted)}
.live-stream{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#0a0a0a 0%,#1a1a1a 100%);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-3d);border:2px solid var(--c-primary)}
.live-badge{position:absolute;top:12px;left:12px;background:var(--c-danger);color:white;padding:.3rem .7rem;border-radius:4px;font-size:.75rem;font-weight:800;z-index:3;display:flex;align-items:center;gap:.4rem;letter-spacing:1px}
.live-dot{width:8px;height:8px;background:white;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.stream-content{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--c-muted);background:radial-gradient(circle at center,rgba(255,59,107,.1),transparent);padding:1rem}
.stream-content .icon{font-size:5rem;color:var(--c-primary);margin-bottom:1rem;animation:floatBall 4s ease-in-out infinite}
.stream-overlay{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.6);padding:.5rem .8rem;border-radius:8px;font-size:.85rem;z-index:3}
.viewer-count{display:flex;align-items:center;gap:.4rem;color:var(--c-accent)}
.alert{padding:.9rem 1.1rem;border-radius:10px;margin-bottom:1rem;font-size:.9rem;border-left:4px solid}
.alert-info{background:rgba(74,163,255,.1);border-color:var(--c-info);color:var(--c-info)}
.alert-warning{background:rgba(255,165,0,.1);border-color:var(--c-warning);color:var(--c-warning)}
.alert-success{background:rgba(25,210,124,.1);border-color:var(--c-success);color:var(--c-success)}
.alert-danger{background:rgba(255,77,77,.1);border-color:var(--c-danger);color:var(--c-danger)}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;border-bottom:2px solid rgba(255,255,255,.1);margin-bottom:1.5rem}
.tab{padding:.6rem 1.1rem;background:none;border:none;color:var(--c-muted);font-weight:700;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:var(--font-body);text-transform:uppercase;letter-spacing:.5px;font-size:.9rem;transition:all .2s}
.tab.active{color:var(--c-accent);border-color:var(--c-primary)}.tab:hover{color:var(--c-text)}
.tab-content{display:none}.tab-content.active{display:block;animation:fadeIn .3s}
.auth-gate{max-width:420px;margin:4rem auto;text-align:center;padding:2rem}.auth-gate .icon{font-size:4rem;color:var(--c-accent)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--c-deeper)}::-webkit-scrollbar-thumb{background:var(--c-card-2);border-radius:5px}::-webkit-scrollbar-thumb:hover{background:var(--c-primary)}
.stream-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
@media(max-width:700px){.stream-modal-grid{grid-template-columns:1fr}}
.stream-choice{background:var(--c-deeper);border:2px solid rgba(255,255,255,.1);border-radius:12px;padding:1.2rem;cursor:pointer;transition:all .2s;text-align:center}
.stream-choice:hover{border-color:var(--c-primary);background:rgba(255,59,107,.08);transform:translateY(-3px)}
.stream-choice .icon{font-size:2.5rem;margin-bottom:.5rem}
.stream-choice h4{margin-bottom:.3rem}
.stream-choice p{color:var(--c-muted);font-size:.85rem}
.code-block{width:100%;min-height:100px;max-height:200px;background:#000;color:#00ff88;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:.6rem;font-family:'Courier New',monospace;font-size:.75rem;word-break:break-all;resize:vertical}
.code-block:focus{outline:none;border-color:var(--c-accent)}
.live-room-card{position:relative;background:linear-gradient(135deg,#1a0a0a 0%,var(--c-card) 100%);border:2px solid var(--c-danger);border-radius:12px;padding:1rem;margin-bottom:.8rem}
.live-room-card h4{color:var(--c-text);margin-bottom:.3rem}
.live-room-card .live-pill{position:absolute;top:10px;right:10px;background:var(--c-danger);color:white;padding:.2rem .6rem;border-radius:4px;font-size:.7rem;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:.4rem}
.live-room-card .live-pill .live-dot{width:6px;height:6px}
.video-preview{width:100%;background:#000;border-radius:8px;aspect-ratio:16/9;object-fit:cover}
.device-bar{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.device-bar button{flex:1;min-width:80px}
.device-bar button.active{background:var(--gradient-1);color:var(--c-deep)}
.player-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:.6rem;border:2px solid var(--c-primary)}
.team-avatar{width:96px;height:96px;margin:0 auto .8rem;border-radius:50%;background:var(--gradient-1);display:grid;place-items:center;font-size:2.5rem;overflow:hidden;box-shadow:var(--shadow-3d)}
.team-avatar img{width:100%;height:100%;object-fit:cover}
</style>

<body>

<nav class="nav"></nav>
<div class="ticker"><div class="ticker-track container"></div></div>
<main id="app-main"></main>
<footer class="footer"></footer>

<script>
/* =========================================================
   APP — storage, auth, navbar, footer, chat, ticker
   ========================================================= */
const APP = {
  name: 'Gen Z Volleyball Malawi', short: 'GZVM', storageKey: 'gzvm_data_v3',
  data: { users:[], players:[], teams:[], matches:[], bookings:[], highlights:[], donations:[], chat:[], feedback:[], strategy:[], notifications:[] },
  load() { try { const r = localStorage.getItem(this.storageKey); if (r) this.data = { ...this.data, ...JSON.parse(r) }; } catch(e){} },
  save() { try { localStorage.setItem(this.storageKey, JSON.stringify(this.data)); } catch(e){} },
  uid() { return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); },
  hash(s) { let h=0; for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0;} return 'h_'+Math.abs(h); },
  fmtDate(d) { if(!d) return 'TBD'; return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); },
  fmtTime(d) { return new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); },
  countdown(target) { const t=new Date(target).getTime(), n=Date.now(), diff=Math.max(0,t-n); return { d:Math.floor(diff/86400000), h:Math.floor((diff%86400000)/3600000), m:Math.floor((diff%3600000)/60000), s:Math.floor((diff%60000)/1000), total:diff }; },
  currentUser() { const id=sessionStorage.getItem('gzvm_user'); return this.data.users.find(u=>u.id===id) || null; },
  login(email,password) { const u=this.data.users.find(x=>x.email.toLowerCase()===email.toLowerCase()); if(!u) throw new Error('No account with that email'); if(u.passwordHash!==this.hash(password)) throw new Error('Wrong password'); sessionStorage.setItem('gzvm_user',u.id); return u; },
  logout() { sessionStorage.removeItem('gzvm_user'); },
  register({name,email,password,role}) { if(this.data.users.some(u=>u.email.toLowerCase()===email.toLowerCase())) throw new Error('Email already registered'); const u={id:this.uid(),name,email,role:role||'player',passwordHash:this.hash(password),createdAt:new Date().toISOString()}; this.data.users.push(u); this.save(); sessionStorage.setItem('gzvm_user',u.id); return u; },
  toast(message,type='info') { let stack=document.querySelector('.toast-stack'); if(!stack){stack=document.createElement('div');stack.className='toast-stack';document.body.appendChild(stack);} const t=document.createElement('div');t.className='toast '+type;t.textContent=message;stack.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(120%)';t.style.transition='all .3s';setTimeout(()=>t.remove(),300);},3500); },
  escapeHtml(s) { return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  embedUrl(id) { return `https://www.youtube.com/embed/${id}?autoplay=0&rel=0&modestbranding=1`; },
  thumbUrl(id) { return `https://img.youtube.com/vi/${id}/mqdefault.jpg`; },
  publicHighlights: [
    {id:'ph1',title:'Best Volleyball Spikes 2024',channel:'Sports Arena',videoId:'k3hAkv3Gf50',category:'spikes',duration:'8:12'},
    {id:'ph2',title:'Incredible Volleyball Saves',channel:'Volley Highlights',videoId:'F6W-b3iAIkM',category:'saves',duration:'6:45'},
    {id:'ph3',title:'Top 10 Volleyball Serves',channel:'Volleyball World',videoId:'l1cD9LMbcwE',category:'serves',duration:'5:20'},
    {id:'ph4',title:'Monster Blocks Compilation',channel:'Block Party',videoId:'A8A5QxqDYzw',category:'blocks',duration:'7:33'},
    {id:'ph5',title:'Volleyball Setting Masterclass',channel:'Coach Insights',videoId:'jS4nD5b3GCA',category:'sets',duration:'9:15'},
    {id:'ph6',title:'African Volleyball Championship Highlights',channel:'CAVB',videoId:'M7lc1UVf-VE',category:'matches',duration:'10:48'}
  ],
  renderNavbar(currentPage) {
    const nav = document.querySelector('.nav');
    if (!nav) return;
    const user = this.currentUser();
    const links = [
      { id:'home', label:'Home' }, { id:'training', label:'Training' }, { id:'live', label:'Live' },
      { id:'teams', label:'Teams' }, { id:'leaderboard', label:'Leaderboard' }, { id:'matches', label:'Matches' },
      { id:'register', label:'Register' }, { id:'donate', label:'Donate' }
    ];
    nav.innerHTML = `
      <div class="container nav-inner">
        <a class="brand" href="#home" data-nav="home">
          <div class="logo">🏐</div>
          <div>GEN Z <span class="gradient-text">VOLLEYBALL</span><small>MALAWI</small></div>
        </a>
        <button class="nav-toggle" aria-label="menu">☰</button>
        <ul class="nav-links">
          ${links.map(l=>`<li><a href="#${l.id}" data-nav="${l.id}" class="${currentPage===l.id?'active':''}">${l.label}</a></li>`).join('')}
          ${user?`<li><a href="#locker" data-nav="locker" class="${currentPage==='locker'?'active':''}">🔒 Locker</a></li><li><a href="#" id="logout-btn">Logout</a></li>`:`<li><a href="#login" data-nav="login" class="${currentPage==='login'?'active':''}">Login</a></li>`}
        </ul>
      </div>`;
    nav.querySelectorAll('[data-nav]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); location.hash = '#' + a.dataset.nav; }));
    const toggle = nav.querySelector('.nav-toggle'); const linksEl = nav.querySelector('.nav-links');
    if (toggle) toggle.addEventListener('click', () => linksEl.classList.toggle('open'));
    const lo = nav.querySelector('#logout-btn');
    if (lo) lo.addEventListener('click', e => { e.preventDefault(); this.logout(); this.toast('Logged out', 'success'); location.hash = '#home'; });
  },
  renderFooter() {
    const f = document.querySelector('.footer');
    if (!f) return;
    f.innerHTML = `<div class="container"><div class="footer-grid">
      <div><h4>${this.name}</h4><p class="muted" style="font-size:.9rem">Empowering the next generation of Malawian volleyball athletes. Train hard. Play smart. Rise together.</p>
      <div style="margin-top:.8rem;display:flex;gap:.5rem"><a href="#">📘</a><a href="#">📸</a><a href="#">🎵</a><a href="#">▶️</a></div></div>
      <div><h4>Quick Links</h4><ul><li><a href="#training">Training Tips</a></li><li><a href="#teams">Teams</a></li><li><a href="#leaderboard">Leaderboard</a></li><li><a href="#matches">Book a Match</a></li><li><a href="#register">Register</a></li><li><a href="#donate">Donate</a></li></ul></div>
      <div><h4>For Teams</h4><ul><li><a href="#locker">Coach Locker Room</a></li><li><a href="#register">Team Sign Up</a></li><li><a href="#matches">Match Booking</a></li><li><a href="#live">Live Streaming</a></li></ul></div>
      <div><h4>Contact</h4><ul><li>📍 Blantyre, Malawi</li><li>📞 +265 888 123 456</li><li>✉️ hello@genzvolleyball.mw</li></ul></div>
    </div><div class="footer-bottom">© ${new Date().getFullYear()} ${this.name}. All rights reserved. Built with 🏐 for the under-25 community.</div></div>`;
  },
  renderTicker() {
    const el = document.querySelector('.ticker-track'); if (!el) return;
    const items = []; const recent = this.data.matches.filter(m => m.status === 'completed').slice(-6);
    recent.forEach(m => { const winner = m.score.home > m.score.away ? m.homeTeam : m.awayTeam; const cls = m.score.home > m.score.away ? 'win' : (m.score.home < m.score.away ? 'loss' : 'draw'); items.push(`<span class="${cls}">🏐 ${m.homeTeam} ${m.score.home} - ${m.score.away} ${m.awayTeam} → ${winner} wins!</span>`); });
    if (items.length === 0) el.innerHTML = '<span>🏐 No matches played yet — register a team to get the first result on the board!</span><span>🏐 No matches played yet — register a team to get the first result on the board!</span>';
    else el.innerHTML = items.join('') + items.join('');
  },
  initChat() {
    if (document.querySelector('.chat-fab')) return;
    const fab = document.createElement('button'); fab.className = 'chat-fab'; fab.innerHTML = '💬'; fab.title = 'Open chat'; fab.setAttribute('aria-label','Open chat');
    const panel = document.createElement('div'); panel.className = 'chat-panel';
    panel.innerHTML = `<div class="chat-header"><span>🏐 Team Chat</span><button aria-label="Close chat">✕</button></div><div class="chat-body"></div><form class="chat-input"><input type="text" placeholder="Type a message..." maxlength="300" required><button type="submit">Send</button></form>`;
    document.body.appendChild(fab); document.body.appendChild(panel);
    const body = panel.querySelector('.chat-body'); const input = panel.querySelector('input'); const form = panel.querySelector('form');
    const render = () => { const me = this.currentUser(); body.innerHTML = this.data.chat.slice(-50).map(m => `<div class="chat-msg ${me && m.userId === me.id ? 'me' : ''}"><div class="who">${this.escapeHtml(m.user)}</div><div>${this.escapeHtml(m.text)}</div></div>`).join(''); body.scrollTop = body.scrollHeight; };
    fab.addEventListener('click', () => { panel.classList.toggle('open'); if (panel.classList.contains('open')) render(); });
    panel.querySelector('.chat-header button').addEventListener('click', () => panel.classList.remove('open'));
    form.addEventListener('submit', e => { e.preventDefault(); const me = this.currentUser(); const name = me ? me.name : (localStorage.getItem('gzvm_chat_name') || ('Guest_' + Math.floor(Math.random()*999))); if (!me) localStorage.setItem('gzvm_chat_name', name); const text = input.value.trim(); if (!text) return; this.data.chat.push({id:this.uid(),userId:me?.id,user:name,text,time:Date.now()}); if (this.data.chat.length > 200) this.data.chat = this.data.chat.slice(-200); this.save(); input.value = ''; render(); });
  },
  renderBackground() { if (document.querySelector('.scene-3d')) return; const scene = document.createElement('div'); scene.className = 'scene-3d'; document.body.prepend(scene); if (window.innerWidth > 600) { const ball = document.createElement('div'); ball.className = 'ball-3d'; document.body.appendChild(ball); } },
  attachTilt(selector = '.card-3d') { document.querySelectorAll(selector).forEach(card => { card.addEventListener('mousemove', e => { const r = card.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top; card.style.setProperty('--rx', ((y / r.height) - 0.5) * -8 + 'deg'); card.style.setProperty('--ry', ((x / r.width) - 0.5) * 8 + 'deg'); }); card.addEventListener('mouseleave', () => { card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg'); }); }); },
  async init() { this.load(); this.renderBackground(); this.renderNavbar(currentPage); this.renderFooter(); this.initChat(); if (window.LIVE) LIVE.init(); }
};

/* =========================================================
   LIVE STREAMING — WebRTC P2P + External RTMP
   ========================================================= */
const LIVE = {
  state: 'idle', localStream: null, currentRoom: null, peers: new Map(),
  config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] },
  signaling: { pendingOffer: null, pendingAnswer: null },
  rooms: [],
  init() { this.loadRooms(); this.renderBroadcastButton(); },
  loadRooms() { try { const r = localStorage.getItem('gzvm_rooms'); this.rooms = r ? JSON.parse(r) : []; } catch { this.rooms = []; } },
  saveRooms() { try { localStorage.setItem('gzvm_rooms', JSON.stringify(this.rooms)); } catch {} },
  createRoom(hostName, title, description, type = 'p2p') { const room = { id: 'room_' + Date.now() + '_' + Math.random().toString(36).slice(2,6), host: hostName, title: title || 'Live stream', description: description || '', type, externalUrl: null, startedAt: new Date().toISOString(), viewers: 0, active: true }; this.rooms = this.rooms.filter(r => r.id !== room.id); this.rooms.push(room); this.saveRooms(); return room; },
  endRoom(roomId) { const r = this.rooms.find(x => x.id === roomId); if (r) { r.active = false; r.endedAt = new Date().toISOString(); } this.saveRooms(); },
  getActiveRooms() { return this.rooms.filter(r => r.active); },
  listenToRooms(callback) { window.addEventListener('storage', e => { if (e.key === 'gzvm_rooms') { this.loadRooms(); callback(); } }); setInterval(() => { const before = JSON.stringify(this.rooms); this.loadRooms(); if (JSON.stringify(this.rooms) !== before) callback(); }, 3000); },
  async getCamera() { if (this.localStream) return this.localStream; try { this.localStream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: { echoCancellation: true, noiseSuppression: true } }); return this.localStream; } catch (err) { throw new Error('Camera/mic access denied: ' + err.message); } },
  stopCamera() { if (this.localStream) { this.localStream.getTracks().forEach(t => t.stop()); this.localStream = null; } this.peers.forEach(pc => pc.close()); this.peers.clear(); },
  async createOffer(roomId) { const stream = await this.getCamera(); const pc = new RTCPeerConnection(this.config); stream.getTracks().forEach(t => pc.addTrack(t, stream)); const offer = await pc.createOffer(); await pc.setLocalDescription(offer); await new Promise(resolve => { if (pc.iceGatheringState === 'complete') return resolve(); pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') resolve(); }); setTimeout(resolve, 3000); }); const offerCode = btoa(JSON.stringify(pc.localDescription)); this.signaling.pendingOffer = { roomId, pc, offerCode }; return offerCode; },
  async acceptOffer(offerCode) { const stream = await this.getCamera(); const pc = new RTCPeerConnection(this.config); stream.getTracks().forEach(t => pc.addTrack(t, stream)); const offer = JSON.parse(atob(offerCode)); await pc.setRemoteDescription(offer); const answer = await pc.createAnswer(); await pc.setLocalDescription(answer); await new Promise(resolve => { if (pc.iceGatheringState === 'complete') return resolve(); pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') resolve(); }); setTimeout(resolve, 3000); }); const answerCode = btoa(JSON.stringify(pc.localDescription)); this.signaling.pendingAnswer = { pc, answerCode }; return answerCode; },
  async completeConnection(answerCode) { const answer = JSON.parse(atob(answerCode)); const offer = this.signaling.pendingOffer; if (!offer) throw new Error('No pending offer'); await offer.pc.setRemoteDescription(answer); return offer.pc; },
  renderBroadcastButton() { if (document.getElementById('live-fab')) return; const fab = document.createElement('button'); fab.id = 'live-fab'; fab.className = 'live-fab'; fab.innerHTML = '📡'; fab.title = 'Start a live stream'; fab.setAttribute('aria-label','Start a live stream'); document.body.appendChild(fab); fab.addEventListener('click', () => this.openStreamModal()); },
  toEmbedUrl(url) { if (!url) return null; try { const u = new URL(url); if (u.hostname.includes('youtube.com')) { const v = u.searchParams.get('v'); if (v) return `https://www.youtube.com/embed/${v}?autoplay=1&rel=0`; if (u.pathname.startsWith('/live/')) return `https://www.youtube.com/embed${u.pathname}?autoplay=1`; } if (u.hostname === 'youtu.be') { const id = u.pathname.slice(1); return `https://www.youtube.com/embed/${id}?autoplay=1`; } if (u.hostname.includes('twitch.tv')) { const path = u.pathname.replace(/^\//,'').split('/')[0]; if (path) return `https://player.twitch.tv/?channel=${path}&parent=${location.hostname}&autoplay=true`; } if (u.hostname.includes('facebook.com') || u.hostname.includes('fb.watch')) { return `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&autoplay=true`; } if (u.hostname.includes('vimeo.com')) { const id = u.pathname.split('/').filter(Boolean).pop(); return `https://player.vimeo.com/video/${id}?autoplay=1`; } return url; } catch { return url; } },
  openStreamModal(mode = null) {
    const existing = document.getElementById('stream-modal'); if (existing) existing.remove();
    const modal = document.createElement('div'); modal.id = 'stream-modal'; modal.className = 'modal-backdrop open';
    modal.innerHTML = `<div class="modal"><div class="modal-header"><h3>📡 Go Live</h3><button class="modal-close" data-close>✕</button></div>
      <p class="muted" style="font-size:.9rem">Pick how you want to stream. Everyone on the site will be able to watch.</p>
      <div class="stream-modal-grid">
        <div class="stream-choice" id="choose-p2p"><div class="icon">🏐</div><h4>Stream from my camera</h4><p>P2P WebRTC. Best for small audiences (5-20 viewers). No server needed.</p></div>
        <div class="stream-choice" id="choose-external"><div class="icon">📺</div><h4>Stream via YouTube / Twitch / Facebook</h4><p>Use a streaming service for big audiences (50+). Just paste your stream URL.</p></div>
      </div>
      <div id="p2p-panel" style="display:none;margin-top:1.5rem">
        <h4>📹 Camera Broadcast</h4>
        <p class="muted" style="font-size:.85rem">Broadcasters create a share code. Viewers paste it to connect.</p>
        <div class="grid-2" style="margin-top:1rem">
          <div>
            <h5 style="color:var(--c-accent)">📤 As Broadcaster</h5>

};

let currentPage = 'home';
let pageIntervals = [];

function clearPageIntervals() { pageIntervals.forEach(i => clearInterval(i)); pageIntervals = []; }

function navigate(page, params = {}) {
  clearPageIntervals();
  currentPage = page;
  const handler = ROUTES[page] || renderHome;
  APP.renderNavbar(page);
  document.getElementById('app-main').innerHTML = handler(params);
  APP.attachTilt();
  window.scrollTo(0, 0);
}

function getHash() { const h = location.hash.slice(1) || 'home'; const [page, query] = h.split('?'); const params = {}; if (query) query.split('&').forEach(p => { const [k, v] = p.split('='); params[k] = v; }); return { page, params }; }

window.addEventListener('hashchange', () => { const { page, params } = getHash(); navigate(page, params); });

function homeIntervals() {
  const tick = () => {
    const upcoming = APP.data.matches.filter(m => m.status === 'scheduled' && m.date && new Date(m.date) > new Date()).sort((a, b) => new Date(a.date) - new Date(b.date));
    const next = upcoming[0] || null;
    const wrap = document.getElementById('countdown-next'); const info = document.getElementById('next-match-info');
    if (!next) { if (wrap) wrap.innerHTML = '<div class="countdown-unit"><span class="num">—</span><span class="lbl">No match</span></div>'; if (info) info.innerHTML = 'No matches scheduled yet. <a href="#matches">Book one →</a>'; return; }
    const c = APP.countdown(next.date);
    if (wrap) wrap.innerHTML = `<div class="countdown-unit"><span class="num">${c.d}</span><span class="lbl">Days</span></div><div class="countdown-unit"><span class="num">${String(c.h).padStart(2,'0')}</span><span class="lbl">Hours</span></div><div class="countdown-unit"><span class="num">${String(c.m).padStart(2,'0')}</span><span class="lbl">Mins</span></div><div class="countdown-unit"><span class="num">${String(c.s).padStart(2,'0')}</span><span class="lbl">Secs</span></div>`;
    if (info) info.innerHTML = `<strong>${APP.escapeHtml(next.homeTeam)}</strong> vs <strong>${APP.escapeHtml(next.awayTeam)}</strong> — ${APP.fmtDate(next.date)} at ${APP.fmtTime(next.date)}`;
  };
  tick(); pageIntervals.push(setInterval(tick, 1000));

  // Reel
  let reelIndex = 0;
  const renderReel = () => {
    const liveMatch = APP.data.matches.find(m => m.status === 'live');
    const liveRooms = LIVE.getActiveRooms();
    const placeholder = document.getElementById('reel-placeholder');
    const overlay = document.getElementById('reel-overlay');
    const stream = document.getElementById('home-reel');
    if (!stream) return;
    stream.querySelectorAll('iframe').forEach(f => f.remove());
    stream.querySelectorAll('.live-badge').forEach(b => b.remove());
    if (liveMatch) {
      stream.insertAdjacentHTML('afterbegin', '<div class="live-badge"><span class="live-dot"></span> ON AIR</div>');
      placeholder.innerHTML = `<div class="icon">🏐</div><h3 style="color:white">${APP.escapeHtml(liveMatch.homeTeam)} vs ${APP.escapeHtml(liveMatch.awayTeam)}</h3><p>Match in progress</p><a href="#live" class="btn btn-primary" style="margin-top:1rem">Watch Live →</a>`;
      placeholder.style.display = 'flex'; overlay.style.display = 'flex';
      overlay.querySelector('#reel-title').textContent = '📍 ' + (liveMatch.venue || 'Live');
      overlay.querySelector('#reel-counter').textContent = '● LIVE';
      return;
    }
    if (liveRooms.length) {
      const room = liveRooms[0];
      stream.insertAdjacentHTML('afterbegin', '<div class="live-badge"><span class="live-dot"></span> ON AIR</div>');
      overlay.style.display = 'flex';
      overlay.querySelector('#reel-title').textContent = `📡 ${room.title}`;
      overlay.querySelector('#reel-counter').textContent = `● LIVE — ${room.host}`;
      if (room.type === 'external' && room.externalUrl) {
        const iframe = document.createElement('iframe');
        iframe.src = LIVE.toEmbedUrl(room.externalUrl);
        iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
        iframe.allowFullscreen = true;
        iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0';
        stream.appendChild(iframe);
        placeholder.style.display = 'none';
      } else {
        placeholder.style.display = 'flex';
        placeholder.innerHTML = `<div class="icon">📡</div><h3 style="color:white">${APP.escapeHtml(room.title)}</h3><p>Live P2P stream by ${APP.escapeHtml(room.host)}</p><a href="#live?room=${room.id}" class="btn btn-primary" style="margin-top:1rem">▶ Join Stream</a>`;
      }
      return;
    }
    const v = APP.publicHighlights[reelIndex % APP.publicHighlights.length];
    const iframe = document.createElement('iframe');
    iframe.src = APP.embedUrl(v.videoId);
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0';
    stream.appendChild(iframe);
    placeholder.style.display = 'none';
    overlay.style.display = 'flex';
    overlay.querySelector('#reel-title').textContent = v.title;
    overlay.querySelector('#reel-counter').textContent = `▶ Reel ${reelIndex + 1} / ${APP.publicHighlights.length}`;
  };
  renderReel();
  pageIntervals.push(setInterval(() => { reelIndex++; renderReel(); }, 45000));
  pageIntervals.push(setInterval(renderReel, 30000));

  // Score pad
  const sp = { home: 0, away: 0, sets: [] };
  const renderScorePad = () => {
    const $ = id => document.getElementById(id);
    if (!$('sp-home')) return;
    $('sp-home').textContent = sp.home; $('sp-away').textContent = sp.away;
    $('sp-sets').innerHTML = sp.sets.map((s, i) => `<div class="set-pill">Set ${i+1}: ${s[0]}-${s[1]}</div>`).join('') || '<span class="muted" style="font-size:.85rem">No sets completed</span>';
    $('sp-set-label').textContent = `Set ${sp.sets.length + 1}`;
  };
  document.querySelectorAll('.scorepad-score button').forEach(btn => {
    btn.addEventListener('click', () => { const team = btn.dataset.team; const delta = parseInt(btn.dataset.delta); sp[team] = Math.max(0, sp[team] + delta); $('sp-home-name').textContent = $('sp-team-home-input').value || 'Home'; $('sp-away-name').textContent = $('sp-team-away-input').value || 'Away'; renderScorePad(); });
  });
  const hi = document.getElementById('sp-team-home-input'); if (hi) hi.addEventListener('input', e => $('sp-home-name').textContent = e.target.value || 'Home');
  const ai = document.getElementById('sp-team-away-input'); if (ai) ai.addEventListener('input', e => $('sp-away-name').textContent = e.target.value || 'Away');

  const playHighlight = (videoId, title, idx) => { clearPlayer(); const placeholder = document.getElementById('player-placeholder'); const overlay = document.getElementById('player-overlay'); const iframe = document.createElement('iframe'); iframe.src = APP.embedUrl(videoId) + '&autoplay=1'; iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture'; iframe.allowFullscreen = true; iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0;z-index:3'; document.getElementById('main-player').appendChild(iframe); placeholder.style.display = 'none'; overlay.style.display = 'flex'; document.getElementById('overlay-title').textContent = title; if (typeof idx === 'number') { currentIndex = idx; document.getElementById('overlay-counter').textContent = `🎬 ${idx + 1} / ${APP.publicHighlights.length}`; } document.getElementById('stream-badge').innerHTML = '▶ NOW PLAYING'; document.getElementById('stream-badge').style.background = 'var(--c-accent-2)'; document.getElementById('stream-title').textContent = title; };
  const playExternal = (url, title, service) => { clearPlayer(); const iframe = document.createElement('iframe'); iframe.src = LIVE.toEmbedUrl(url); iframe.allow = 'autoplay; encrypted-media; picture-in-picture'; iframe.allowFullscreen = true; iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0;z-index:3'; document.getElementById('main-player').appendChild(iframe); document.getElementById('player-placeholder').style.display = 'none'; document.getElementById('player-overlay').style.display = 'flex'; document.getElementById('overlay-title').textContent = title; document.getElementById('overlay-counter').textContent = `📡 ${service || 'External'}`; document.getElementById('stream-badge').innerHTML = '<span class="live-dot"></span> ON AIR'; document.getElementById('stream-badge').style.background = 'var(--c-danger)'; document.getElementById('stream-title').textContent = title; clearInterval(autoplayTimer); };
  const showP2PJoinPanel = (room) => { const player = document.getElementById('main-player'); clearPlayer(); document.getElementById('player-placeholder').style.display = 'flex'; document.getElementById('player-placeholder').innerHTML = `<div style="padding:2rem;max-width:500px"><div class="icon">📡</div><h3 style="color:white">${APP.escapeHtml(room.title)}</h3><p>Hosted by ${APP.escapeHtml(room.host)} • Started ${APP.fmtTime(room.startedAt)}</p><p class="muted" style="font-size:.9rem;margin-top:1rem">This is a peer-to-peer stream. To watch, you need the share code from the broadcaster.</p><button class="btn btn-primary" style="margin-top:1rem" onclick="LIVE.openStreamModal('p2p'); setTimeout(()=>{const i=document.getElementById('offer-input'); if(i) i.scrollIntoView({block:'center'});}, 100)">📥 Join Stream</button></div>`; document.getElementById('stream-badge').innerHTML = '● P2P LIVE'; document.getElementById('stream-badge').style.background = 'var(--c-accent)'; document.getElementById('stream-title').textContent = room.title; clearInterval(autoplayTimer); };
  const enterReelMode = () => { document.getElementById('stream-badge').innerHTML = '● OFF AIR'; document.getElementById('stream-badge').style.background = 'var(--c-muted)'; document.getElementById('stream-title').textContent = 'Highlights Reel'; if (APP.publicHighlights.length) playHighlight(APP.publicHighlights[0].videoId, APP.publicHighlights[0].title, 0); else { document.getElementById('player-placeholder').style.display = 'flex'; document.getElementById('player-placeholder').innerHTML = `<div class="icon">🏐</div><h3 style="color:white">No highlights available</h3><p>Check back later</p>`; } startAutoplay(); };
  const startAutoplay = () => { clearInterval(autoplayTimer); if (!autoplay) return; autoplayTimer = setInterval(() => { if (!autoplay) return; currentIndex = (currentIndex + 1) % APP.publicHighlights.length; const v = APP.publicHighlights[currentIndex]; playHighlight(v.videoId, v.title, currentIndex); }, 45000); };
  document.getElementById('autoplay-toggle').addEventListener('click', e => { autoplay = !autoplay; e.target.textContent = autoplay ? '⏯ Autoplay: ON' : '⏯ Autoplay: OFF'; if (autoplay) startAutoplay(); else clearInterval(autoplayTimer); });
  const renderHighlightsGrid = () => { const grid = document.getElementById('highlights-grid'); if (!grid) return; const user = APP.data.highlights.map(h => ({ id: h.id, title: h.title, sub: h.player || '—', videoId: h.videoId, source: 'user' })); const pub = APP.publicHighlights.map((p, i) => ({ id: p.id, title: p.title, sub: p.channel + ' • ' + p.duration, videoId: p.videoId, source: 'public', idx: i })); const all = [...user, ...pub]; if (!all.length) { grid.innerHTML = '<p class="muted text-center" style="grid-column:1/-1;padding:2rem">No highlights yet.</p>'; return; } grid.innerHTML = all.map(h => `<div class="highlight-card" onclick="window._playCard('${h.videoId || ''}','${APP.escapeHtml(h.title).replace(/'/g,"&#39;")}',${h.idx ?? -1})"><img src="${APP.thumbUrl(h.videoId)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'"><div class="highlight-thumb" style="background:transparent"></div><div class="play-btn">▶</div><div class="highlight-info"><h4>${APP.escapeHtml(h.title)}</h4><div class="highlight-meta">${APP.escapeHtml(h.sub)}${h.source === 'public' ? ' • 🌐 Featured' : ''}</div></div></div>`).join(''); };
  window._playCard = (videoId, title, idx) => { if (!videoId) return APP.toast('No video available', 'warning'); playHighlight(videoId, title, idx >= 0 ? idx : 0); document.getElementById('main-player').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  const renderLiveRoomsStrip = () => { const wrap = document.getElementById('live-rooms-strip'); const active = LIVE.getActiveRooms(); if (!active.length) { wrap.innerHTML = ''; return; } wrap.innerHTML = `<div class="alert alert-danger" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem"><div><strong>📡 ${active.length} live stream${active.length === 1 ? '' : 's'} right now</strong><p class="muted" style="font-size:.85rem;margin:0">${active.map(r => `<span>• ${APP.escapeHtml(r.title)} (${APP.escapeHtml(r.host)})</span>`).join(' ')}</p></div><div style="display:flex;gap:.4rem;flex-wrap:wrap">${active.map(r => `<a class="btn btn-sm btn-primary" href="#live?room=${r.id}">▶ Watch "${APP.escapeHtml(r.title)}"</a>`).join('')}</div></div>`; };
  renderHighlightsGrid();
  // Init
  renderLiveRoomsStrip(); LIVE.listenToRooms(renderLiveRoomsStrip);
  if (p.room) { const room = LIVE.rooms.find(r => r.id === p.room && r.active); if (room) { if (room.type === 'external' && room.externalUrl) { playExternal(room.externalUrl, room.title, room.service); return; } showP2PJoinPanel(room); return; } }
  const live = APP.data.matches.find(m => m.status === 'live'); if (live) { const badge = document.getElementById('stream-badge'); badge.innerHTML = '<span class="live-dot"></span> ON AIR'; badge.style.background = 'var(--c-danger)'; document.getElementById('stream-title').textContent = 'Live Now'; document.getElementById('player-placeholder').innerHTML = `<div class="icon">🏐</div><h3 style="color:white">${APP.escapeHtml(live.homeTeam)} vs ${APP.escapeHtml(live.awayTeam)}</h3><p>Match is live</p>`; document.getElementById('player-placeholder').style.display = 'flex'; document.getElementById('player-overlay').style.display = 'flex'; document.getElementById('overlay-title').textContent = '📍 ' + (live.venue || 'Live'); document.getElementById('overlay-counter').innerHTML = '<span class="live-dot"></span> ● LIVE'; return; }
  if (p.v) { const found = APP.publicHighlights.find(x => x.videoId === p.v); if (found) { playHighlight(found.videoId, found.title, APP.publicHighlights.indexOf(found)); return; } }
  enterReelMode();
  pageIntervals.push(setInterval(() => { const l = APP.data.matches.find(m => m.status === 'live'); const badge = document.getElementById('stream-badge').textContent; if (l && !badge.includes('ON AIR')) { const b = document.getElementById('stream-badge'); b.innerHTML = '<span class="live-dot"></span> ON AIR'; b.style.background = 'var(--c-danger)'; document.getElementById('stream-title').textContent = 'Live Now'; document.getElementById('player-placeholder').innerHTML = `<div class="icon">🏐</div><h3 style="color:white">${APP.escapeHtml(l.homeTeam)} vs ${APP.escapeHtml(l.awayTeam)}</h3><p>Match is live</p>`; document.getElementById('player-placeholder').style.display = 'flex'; } if (!l && badge.includes('ON AIR')) enterReelMode(); renderLiveRoomsStrip(); }, 30000));
}

function leaderboardIntervals() {
  let currentFilter = 'all';
  const computeLeaderboard = () => { const sortBy = document.getElementById('sort-by').value; const search = (document.getElementById('search').value || '').toLowerCase(); let players = APP.data.players.map(p => { const stats = p.stats || { serve:0, spike:0, set:0, block:0, pass:0, dig:0 }; return { ...p, stats, total: Object.values(stats).reduce((a,b) => a + (b || 0), 0), mvps: p.mvps || 0 }; }); if (currentFilter !== 'all') players = players.filter(p => (p.position || '').toLowerCase().includes(currentFilter)); if (search) players = players.filter(p => (p.name || '').toLowerCase().includes(search) || (p.team || '').toLowerCase().includes(search)); if (sortBy === 'name') players.sort((a,b) => a.name.localeCompare(b.name)); else if (sortBy === 'mvps') players.sort((a,b) => b.mvps - a.mvps); else if (['serve','spike','set','block','pass','dig'].includes(sortBy)) players.sort((a,b) => (b.stats[sortBy] || 0) - (a.stats[sortBy] || 0)); else players.sort((a,b) => b.total - a.total); return players; };
  const renderLeaderboard = () => { const players = computeLeaderboard(); const tbody = document.getElementById('lb-body'); const empty = document.getElementById('lb-empty'); if (!APP.data.players.length) { tbody.innerHTML = ''; empty.style.display = 'block'; document.getElementById('podium').innerHTML = ''; return; } empty.style.display = 'none'; if (!players.length) { tbody.innerHTML = '<tr><td colspan="12" class="text-center muted" style="padding:2rem">No players match your filters</td></tr>'; return; } tbody.innerHTML = players.map((p, i) => { const r = i + 1; const cls = r === 1 ? 'rank-1' : r === 2 ? 'rank-2' : r === 3 ? 'rank-3' : 'rank-n'; const avatar = p.photo ? `<img src="${APP.escapeHtml(p.photo)}" alt="" class="player-avatar">` : `<span style="display:inline-block;width:36px;height:36px;line-height:36px;text-align:center;border-radius:50%;background:var(--gradient-2);margin-right:.6rem;vertical-align:middle">🏐</span>`; return `<tr><td><span class="rank-badge ${cls}">${r}</span></td><td>${avatar}<strong>${APP.escapeHtml(p.name)}</strong></td><td>${APP.escapeHtml(p.team || '—')}</td><td><span class="tag tag-blue">${p.position || '—'}</span></td><td>${p.stats.serve || 0}</td><td>${p.stats.spike || 0}</td><td>${p.stats.set || 0}</td><td>${p.stats.block || 0}</td><td>${p.stats.pass || 0}</td><td>${p.stats.dig || 0}</td><td><strong style="color:var(--c-accent)">${p.total}</strong></td><td>${p.mvps > 0 ? '⭐ ' + p.mvps : '—'}</td></tr>`; }).join(''); const top3 = players.slice(0, 3); const podium = document.getElementById('podium'); const order = [1, 0, 2]; const colors = ['linear-gradient(135deg, #c0c0c0, #888)', 'linear-gradient(135deg, #ffd400, #c89b00)', 'linear-gradient(135deg, #cd7f32, #8a4a1f)']; podium.innerHTML = order.map(i => { const p = top3[i]; if (!p) return '<div></div>'; return `<div class="card card-3d text-center" style="background:${colors[i]};color:var(--c-deep);border:none"><div style="font-size:3rem">${i === 0 ? '🥈' : i === 1 ? '🥇' : '🥉'}</div><h3 style="color:var(--c-deep)">${APP.escapeHtml(p.name)}</h3><p style="font-weight:700">${APP.escapeHtml(p.team || 'Free Agent')}</p><p style="font-size:1.4rem;font-family:var(--font-display);margin-top:.5rem">${p.total} PTS</p><p>${p.mvps} MVPs</p></div>`; }).join(''); };
  document.querySelectorAll('.tab[data-rank]').forEach(t => { t.addEventListener('click', () => { document.querySelectorAll('.tab[data-rank]').forEach(x => x.classList.remove('active')); t.classList.add('active'); currentFilter = t.dataset.rank; renderLeaderboard(); }); });
  document.getElementById('sort-by').addEventListener('change', renderLeaderboard);
  document.getElementById('search').addEventListener('input', renderLeaderboard);
  renderLeaderboard();
}

function registerIntervals() {
  const bindDrop = (id, nameId) => { const drop = document.getElementById(id); const nameEl = document.getElementById(nameId); const input = drop.querySelector('input'); drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); }); drop.addEventListener('dragleave', () => drop.classList.remove('drag')); drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('drag'); if (e.dataTransfer.files.length) { input.files = e.dataTransfer.files; nameEl.textContent = e.dataTransfer.files[0].name; } }); input.addEventListener('change', e => { if (e.target.files.length) nameEl.textContent = e.target.files[0].name; }); };
  bindDrop('med-drop', 'med-name'); bindDrop('logo-drop', 'logo-name'); bindDrop('photo-drop', 'photo-name');
  const SKILLS = [{k:'serve',l:'🎯 Serve'},{k:'spike',l:'💥 Spike'},{k:'set',l:'👐 Set'},{k:'block',l:'🛡️ Block'},{k:'pass',l:'🤲 Pass'},{k:'dig',l:'🤾 Dig'}];

  document.querySelectorAll('#init-skills input[type=range]').forEach(r => r.addEventListener('input', e => e.target.nextElementSibling.querySelector('.skill-val').textContent = e.target.value));
  const loadTeamSelect = () => { const sel = document.querySelector('#player-form select[name=team]'); sel.innerHTML = '<option value="">— Free Agent —</option>' + APP.data.teams.map(t => `<option value="${APP.escapeHtml(t.name)}">${APP.escapeHtml(t.name)} (${t.city})</option>`).join(''); };
  loadTeamSelect();

  document.getElementById('team-form').addEventListener('submit', async e => { e.preventDefault(); const fd = new FormData(e.target); const me = APP.currentUser(); if (!me) { APP.toast('Please log in first to register a team', 'warning'); setTimeout(() => location.hash = '#login', 800); return; } const logoFile = e.target.logo.files[0]; const logoUrl = logoFile ? await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(logoFile); }) : null; const team = { id: APP.uid(), name: fd.get('name'), city: fd.get('city'), coach: fd.get('coach'), contact: fd.get('contact'), email: fd.get('email'), level: fd.get('level'), logo: logoUrl, rosterSize: parseInt(fd.get('rosterSize') || 12), members: [me.id], captainId: me.id, createdAt: new Date().toISOString() }; APP.data.teams.push(team); APP.save(); APP.toast('Team registered! 🏐', 'success'); e.target.reset(); loadTeamSelect(); });
  document.querySelectorAll('.tab[data-reg]').forEach(t => t.addEventListener('click', () => { document.querySelectorAll('.tab[data-reg]').forEach(x => x.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active')); t.classList.add('active'); document.getElementById('reg-' + t.dataset.reg).classList.add('active'); }));
