      <div class="tabs" style="justify-content:center"><button class="tab active" data-au="login">Login</button><button class="tab" data-au="signup">Sign Up</button></div>
      <div class="grid-2" style="max-width:900px;margin:0 auto">
        <div class="tab-content active" id="au-login"><div class="card card-3d"><h3>Welcome Back 🏐</h3><p class="muted" style="font-size:.9rem">Login to access your dashboard, training tracker, and locker room.</p>
          <form id="login-form" style="margin-top:1rem"><div class="form-group"><label>Email</label><input type="email" name="email" class="form-control" required></div><div class="form-group"><label>Password</label><input type="password" name="password" class="form-control" required></div><button type="submit" class="btn btn-primary btn-block">Login →</button></form>
          <p class="muted text-center" style="font-size:.85rem;margin-top:1rem">No account yet? <a href="#" id="goto-signup">Sign up</a></p>
        </div></div>
        <div class="tab-content" id="au-signup"><div class="card card-3d"><h3>Create Account</h3><p class="muted" style="font-size:.9rem">Players, coaches, and team captains all need an account.</p>
          <form id="signup-form" style="margin-top:1rem"><div class="form-group"><label>Full Name *</label><input type="text" name="name" class="form-control" required></div><div class="form-group"><label>Email *</label><input type="email" name="email" class="form-control" required></div><div class="form-group"><label>Password *</label><input type="password" name="password" class="form-control" minlength="6" required></div><div class="form-group"><label>Role *</label><select name="role" class="form-control" required><option value="">— Select —</option><option value="player">Player</option><option value="coach">Coach</option><option value="captain">Team Captain</option><option value="admin">League Admin</option><option value="fan">Fan / Supporter</option></select></div><button type="submit" class="btn btn-primary btn-block">Create Account →</button></form>
          <p class="muted text-center" style="font-size:.85rem;margin-top:1rem">Already have an account? <a href="#" id="goto-login">Login</a></p>
        </div></div>
      </div>
    </div></section>`;
}

function loginIntervals() {
  const switchAuth = (tab) => { document.querySelectorAll('.tab[data-au]').forEach(x => x.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active')); document.querySelector(`.tab[data-au="${tab}"]`).classList.add('active'); document.getElementById('au-' + tab).classList.add('active'); };
  document.querySelectorAll('.tab[data-au]').forEach(t => t.addEventListener('click', () => switchAuth(t.dataset.au)));
  document.getElementById('goto-signup').addEventListener('click', e => { e.preventDefault(); switchAuth('signup'); });
  document.getElementById('goto-login').addEventListener('click', e => { e.preventDefault(); switchAuth('login'); });
  document.getElementById('login-form').addEventListener('submit', e => { e.preventDefault(); const fd = new FormData(e.target); try { const u = APP.login(fd.get('email'), fd.get('password')); APP.toast(`Welcome back, ${u.name}!`, 'success'); location.hash = '#home'; } catch (err) { APP.toast(err.message, 'error'); } });
  document.getElementById('signup-form').addEventListener('submit', e => { e.preventDefault(); const fd = new FormData(e.target); try { const u = APP.register({ name: fd.get('name'), email: fd.get('email'), password: fd.get('password'), role: fd.get('role') }); APP.toast(`Account created! Welcome, ${u.name} 🎉`, 'success'); location.hash = '#home'; } catch (err) { APP.toast(err.message, 'error'); } });
}

function renderLocker() {
  const user = APP.currentUser();
  const unlocked = sessionStorage.getItem('gzvm_locker') === '1';
  const ALLOWED = ['coach', 'admin', 'captain'];
  if (!user) return `<div class="auth-gate card card-3d"><div class="icon">🔒</div><h2>Login Required</h2><p class="muted">You must log in to access the Coach Locker Room.</p><a href="#login" class="btn btn-primary" style="margin-top:1rem">Login / Sign Up →</a></div>`;
  if (!ALLOWED.includes(user.role)) return `<div class="auth-gate card card-3d"><div class="icon">🚫</div><h2>Access Denied</h2><p class="muted">Your account (${user.role}) doesn't have locker room access.</p><a href="#home" class="btn btn-ghost" style="margin-top:1rem">← Back to home</a></div>`;
  if (!unlocked) return `<div id="locker-gate" class="auth-gate card card-3d"><div class="icon">🔒</div><h2>Coach Locker Room</h2><p class="muted">Restricted area. Coaches and admins only.</p><button class="btn btn-primary" id="enter-locker" style="margin-top:1rem">Enter Locker Room →</button></div><div class="modal-backdrop" id="password-modal"><div class="modal"><div class="modal-header"><h3>🔐 Enter Locker Room</h3><button class="modal-close" data-close>✕</button></div><p class="muted" style="font-size:.9rem">Enter the coach password to access the strategy area.</p><form id="password-form" style="margin-top:1rem"><div class="form-group"><label>Password</label><input type="password" name="password" class="form-control" required autofocus></div><button type="submit" class="btn btn-primary btn-block">Unlock</button><p class="muted text-center" style="font-size:.8rem;margin-top:.8rem">Demo password: <code>locker2026</code></p></form></div></div>`;
  return `
    <section class="hero" style="padding:2rem 0"><div class="container">
      <span class="tag tag-pink">🔒 COACHES ONLY</span>
      <h1>The <span class="gradient-text">Locker Room</span></h1>
      <p>Strategy videos, private feedback, and team notes. <span class="muted">Logged in as ${user.name} (${user.role})</span></p>
    </div></section>
    <section><div class="container">
      <div class="tabs"><button class="tab active" data-lk="strategy">📹 Strategy Videos</button><button class="tab" data-lk="feedback">💬 Private Feedback</button><button class="tab" data-lk="roster">👥 Roster</button></div>
      <div class="tab-content active" id="lk-strategy"><div class="grid-2">
        <div class="card"><h3>📤 Upload Strategy Video</h3>
          <form id="strategy-form" style="margin-top:1rem"><div class="form-group"><label>Title *</label><input type="text" name="title" class="form-control" placeholder="e.g. Rotation Analysis vs Top Spikers" required></div><div class="form-group"><label>Description</label><textarea name="description" class="form-control" placeholder="Key takeaways, what to focus on…"></textarea></div><div class="form-group"><label>Video URL</label><input type="url" name="videoUrl" class="form-control" placeholder="https://youtube.com/... or .mp4 link"></div><div class="form-group"><label>Tag Players (multi-select)</label><select name="taggedPlayers" class="form-control" multiple size="4" id="tagged-players"></select></div><button type="submit" class="btn btn-primary btn-block">📤 Share with Team</button></form>
        </div>
        <div><h3 style="margin-bottom:1rem">📂 Shared Videos</h3><div id="strategy-list" class="grid-2"></div><p id="strategy-empty" class="text-center muted">No strategy videos yet. Upload one!</p></div>
      </div></div>
      <div class="tab-content" id="lk-feedback"><div class="grid-2">
        <div class="card"><h3>📝 Send Private Feedback</h3>
          <form id="feedback-form" style="margin-top:1rem"><div class="form-group"><label>Player *</label><select name="playerId" class="form-control" required id="fb-player"></select></div><div class="form-group"><label>Feedback Message *</label><textarea name="text" class="form-control" rows="5" placeholder="Constructive notes only. Be specific. Encourage first, then improve." required></textarea></div><div class="form-group"><label>Rating (1-5 stars)</label><select name="rating" class="form-control"><option value="5">⭐⭐⭐⭐⭐ Excellent</option><option value="4">⭐⭐⭐⭐ Strong</option><option value="3" selected>⭐⭐⭐ Solid</option><option value="2">⭐⭐ Developing</option><option value="1">⭐ Needs work</option></select></div><button type="submit" class="btn btn-primary btn-block">Send Feedback</button></form>
        </div>
        <div><h3 style="margin-bottom:1rem">📬 Feedback History</h3><div id="feedback-list"></div><p id="feedback-empty" class="text-center muted">No feedback sent yet.</p></div>
      </div></div>
      <div class="tab-content" id="lk-roster"><div class="card"><h3>👥 Team Roster</h3><p class="muted" style="font-size:.9rem">All registered players across all teams.</p><div class="table-wrap" style="margin-top:1rem"><table id="roster-table"><thead><tr><th>#</th><th>Name</th><th>Team</th><th>Pos</th><th>Age</th><th>Waiver</th><th>Medical</th></tr></thead><tbody></tbody></table></div><p id="roster-empty" class="text-center muted">No players registered yet.</p></div></div>
    </div></section>`;
}

function lockerIntervals() {
  const user = APP.currentUser();
  if (!user) return;
  if (sessionStorage.getItem('gzvm_locker') !== '1') {
    const enterBtn = document.getElementById('enter-locker');
    if (enterBtn) enterBtn.addEventListener('click', () => { document.getElementById('password-modal').classList.add('open'); });
    document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => document.getElementById('password-modal').classList.remove('open')));
    const pf = document.getElementById('password-form');
    if (pf) pf.addEventListener('submit', e => { e.preventDefault(); if (e.target.password.value === 'locker2026') { sessionStorage.setItem('gzvm_locker', '1'); document.getElementById('password-modal').classList.remove('open'); APP.toast('Welcome to the Locker Room 🔓', 'success'); location.hash = '#locker'; } else { APP.toast('Wrong password', 'error'); } });
    return;
  }
  const populatePlayerOptions = () => { const opts = APP.data.players.map(p => `<option value="${p.id}">${APP.escapeHtml(p.name)} (${p.team || '—'})</option>`).join(''); const fb = document.getElementById('fb-player'); if (fb) fb.innerHTML = '<option value="">— Select player —</option>' + opts; const tagged = document.getElementById('tagged-players'); if (tagged) tagged.innerHTML = opts; };
  const loadRoster = () => { const tb = document.querySelector('#roster-table tbody'); const empty = document.getElementById('roster-empty'); if (!APP.data.players.length) { tb.innerHTML = ''; empty.style.display = 'block'; return; } empty.style.display = 'none'; tb.innerHTML = APP.data.players.map((p, i) => `<tr><td>${i+1}</td><td><strong>${APP.escapeHtml(p.name)}</strong></td><td>${APP.escapeHtml(p.team || '—')}</td><td><span class="tag tag-blue">${p.position || '—'}</span></td><td>${p.age || '—'}</td><td>${p.waiver?.signed ? '<span class="tag tag-teal">SIGNED</span>' : '<span class="tag tag-pink">MISSING</span>'}</td><td>${p.medical?.name ? '<span class="tag tag-teal">✓</span>' : '<span class="tag tag-pink">✗</span>'}</td></tr>`).join(''); };
  const loadStrategyList = () => { const list = document.getElementById('strategy-list'); const empty = document.getElementById('strategy-empty'); if (!APP.data.strategy.length) { list.innerHTML = ''; empty.style.display = 'block'; return; } empty.style.display = 'none'; list.innerHTML = APP.data.strategy.slice().reverse().map(s => `<div class="card card-3d"><h3>📹 ${APP.escapeHtml(s.title)}</h3><p class="muted" style="font-size:.85rem">By ${APP.escapeHtml(s.coach)} • ${APP.fmtDate(s.date)}</p><p style="font-size:.9rem">${APP.escapeHtml(s.description || 'No description')}</p>${s.videoUrl ? `<a href="${APP.escapeHtml(s.videoUrl)}" target="_blank" class="btn btn-sm btn-accent">▶ Watch Video</a>` : ''}</div>`).join(''); };
  const loadFeedbackHistory = () => { const list = document.getElementById('feedback-list'); const empty = document.getElementById('feedback-empty'); if (!APP.data.feedback.length) { list.innerHTML = ''; empty.style.display = 'block'; return; } empty.style.display = 'none'; list.innerHTML = APP.data.feedback.slice().reverse().map(f => { const player = APP.data.players.find(p => p.id === f.playerId); return `<div class="card" style="margin-bottom:.8rem"><div style="display:flex;justify-content:space-between;align-items:start"><strong>→ ${APP.escapeHtml(player?.name || 'Unknown')}</strong><span>${'⭐'.repeat(f.rating || 0)}</span></div><p style="margin-top:.5rem">${APP.escapeHtml(f.text)}</p><small class="muted">${APP.fmtDate(f.date)} • from ${APP.escapeHtml(f.coach)}</small></div>`; }).join(''); };
  document.querySelectorAll('.tab[data-lk]').forEach(t => { t.addEventListener('click', () => { document.querySelectorAll('.tab[data-lk]').forEach(x => x.classList.remove('active')); document.querySelectorAll('#lk-strategy, #lk-feedback, #lk-roster').forEach(x => x.classList.remove('active')); t.classList.add('active'); document.getElementById('lk-' + t.dataset.lk).classList.add('active'); }); });
  populatePlayerOptions(); loadRoster(); loadStrategyList(); loadFeedbackHistory();
  document.getElementById('strategy-form').addEventListener('submit', e => { e.preventDefault(); const fd = new FormData(e.target); if (!fd.get('videoUrl')) return APP.toast('Add a video URL', 'error'); const tagged = Array.from(e.target.taggedPlayers.selectedOptions).map(o => o.value); const strategy = { id: APP.uid(), coach: user.name, title: fd.get('title'), description: fd.get('description'), videoUrl: fd.get('videoUrl'), taggedPlayers: tagged, date: new Date().toISOString() }; APP.data.strategy.push(strategy); APP.save(); APP.toast('Strategy video shared! 📹', 'success'); e.target.reset(); loadStrategyList(); });
  document.getElementById('feedback-form').addEventListener('submit', e => { e.preventDefault(); const fd = new FormData(e.target); const feedback = { id: APP.uid(), coach: user.name, playerId: fd.get('playerId'), text: fd.get('text'), rating: parseInt(fd.get('rating') || 3), date: new Date().toISOString() }; APP.data.feedback.push(feedback); APP.save(); APP.toast('Feedback sent! 💬', 'success'); e.target.reset(); loadFeedbackHistory(); });
}

/* =========================================================
   PAGE-DISPATCH (runs after each navigation)
   ========================================================= */
const _origNavigate = navigate;
navigate = function (page, params) {
  _origNavigate(page, params);
  const p = params || {};
  if (page === 'home') homeIntervals();
  else if (page === 'training') trainingIntervals();
  else if (page === 'live') liveIntervals(p);
  else if (page === 'teams') teamsIntervals();
  else if (page === 'leaderboard') leaderboardIntervals();
  else if (page === 'matches') matchesIntervals();
  else if (page === 'register') registerIntervals();
  else if (page === 'donate') donateIntervals();
  else if (page === 'login') loginIntervals();
  else if (page === 'locker') lockerIntervals();
  APP.renderTicker();
};

// Boot
APP.load();
APP.renderBackground();
window.LIVE = LIVE;
window.APP = APP;
const { page, params } = getHash();
navigate(page, params);
</script>
